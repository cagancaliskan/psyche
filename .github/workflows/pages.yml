# Docs site (D-031). Builds website/ from the governed documents of ONE commit
# (tools/publish/stage.py reads every page and data file from HEAD, never from a dirty disk)
# and deploys it to GitHub Pages under /psyche/. The governance workflow runs first: the site
# never deploys from a tree that fails it. Pull requests build but never deploy.
#
# The private denylist reaches CI only as DISCLOSURE_DENYLIST_B64: one line of base64, so
# the log masker holds a single string no log line contains (a plain multi-line secret would
# mask each private term as *** wherever output mentions it, turning the public log into an
# oracle for the list). It is decoded to a 0600 file by tools/publish/decode_denylist.py in
# ONE job, `disclosure`, which prints nothing but the scan's own output (paths, line numbers,
# entry numbers). The build job never receives it.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "website/**"
      - "tools/**"
      - "README.md"
      - "MOC.md"
      - "CITATION.cff"
      - ".github/workflows/pages.yml"
      - ".github/workflows/governance.yml"
  # No paths filter on pull requests: the job named `build` is a required status check of the
  # main branch ruleset, and a required check that a workflow never reports (because the pull
  # request touched no listed path) leaves the pull request waiting for it for ever. Deploys
  # stay limited to pushes to main, above.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per ref, so two deploys never overlap and a deploy in flight is never cancelled. A
# newer push to the same pull request replaces that pull request's run in flight; pull requests
# never deploy, and their group is their own ref, apart from main's.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  governance:
    uses: ./.github/workflows/governance.yml
    with:
      require-disclosure: ${{ github.event_name != 'pull_request' }}
    secrets: inherit

  build:
    needs: governance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The whole history, not the last commit: the sitemap's <lastmod> of each page is the date of the
      # last commit that touched the files the page is made from (website/scripts/sitemap-lastmod.mjs).
      # In a shallow clone every file would carry one date, so the script writes no date at all there,
      # and `npm run check:seo` fails the build when history is available and a date is missing.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install site dependencies
        working-directory: website
        run: npm ci

      - name: Unit tests (plan, maze, battery, search-engine head, progress feed, sitemap dates, page chrome, search override, table regions, a11y tool lock)
        working-directory: website
        run: npm test

      # Besides staging, type-checking and building, `npm run build` checks the social image against the
      # ledger (tools/publish/og.py), the spacing, the per-page budgets and the head of every built page
      # (website/scripts/check-seo.mjs: descriptions, icons, manifest, robots, JSON-LD, sitemap).
      - name: Stage from this commit, type-check and build
        working-directory: website
        run: npm run build

      - name: No staged copy is tracked
        run: |
          if [ -n "$(git ls-files -- website/src/content/docs website/src/data)" ]; then
            echo "a staged copy is tracked; staged content must stay generated" >&2
            exit 1
          fi

      # What the disclosure job scans: the HTML of the research, custom and Start here pages, the 404
      # page included, the three walls page and the progress feed, which carries the plan's text to
      # feed readers. Not included on purpose: the rest of dist/substrate/ (the substrate's own pre-existing
      # record, which uses some denylisted words in the substrate's sense), dist/pagefind/
      # (the search index of every page) and dist/_astro/ (library bundles, whose code
      # legitimately contains common words). The research sources and docs/PSYCHE.md are
      # disclosure-scanned by the governance workflow; docs/ARCHITECTURE.md and
      # docs/METHODOLOGY.md are deliberately not, and only the pull request leak check reads
      # changes to them.
      - name: Keep the research pages for the disclosure scan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: research-pages
          path: |
            website/dist/index.html
            website/dist/404.html
            website/dist/roadmap/
            website/dist/battery/
            website/dist/status/
            website/dist/research/
            website/dist/guide/
            website/dist/faq/
            website/dist/progress/
            website/dist/governance/
            website/dist/substrate/three-walls/
            website/dist/progress.xml
          if-no-files-found: error
          retention-days: 1

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

      # Accessibility of the built pages: website/scripts/check-a11y.mjs serves website/dist on a free
      # local port, drives the runner's Chrome and runs axe-core at WCAG 2.2 AA over every page of the
      # site (found in dist, the 404 page included) and over the interface states a reader opens (the
      # search dialog with results, the phone menu, the phone contents list), light and dark, desktop
      # and phone width. The step fails on any serious or critical violation, and on a page or state
      # it cannot audit; moderate and minor ones are listed, and what axe cannot decide (text contrast
      # over gradients, pseudo-elements and images) is listed for a human look and never fails it. It
      # closes everything it starts.
      # Its two dev packages (puppeteer-core, axe-core) are installed by the script itself, at the exact
      # versions website/scripts/a11y-tools/package.json names and with their own dependencies as its
      # package-lock.json locks them (`npm ci`, tried three times); they are not site dependencies. That
      # is why this is the LAST step of the job, after the site has been uploaded: nothing the step
      # installs or runs can change what is published. A failure here fails the build job, so a pull
      # request cannot merge on it and the deploy job, which needs the build job, does not run. The
      # script's exit code says why: 1 is a violation or a page it could not audit, 2 is that it could not
      # set itself up (npm, Chrome), which says nothing about the site, so that one is run once more.
      - name: Accessibility check (axe-core, WCAG 2.2 AA)
        timeout-minutes: 15
        working-directory: website
        run: |
          status=0
          node scripts/check-a11y.mjs --json "${RUNNER_TEMP}/axe-report.json" || status=$?
          if [ "$status" -eq 2 ]; then
            echo "::warning title=check-a11y::the check could not set itself up; trying once more"
            status=0
            node scripts/check-a11y.mjs --json "${RUNNER_TEMP}/axe-report.json" || status=$?
          fi
          exit "$status"

  disclosure:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out (tools only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/publish

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Fetch the built research pages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: research-pages
          path: built

      - name: Disclosure scan of the built research pages
        env:
          DISCLOSURE_DENYLIST_B64: ${{ secrets.DISCLOSURE_DENYLIST_B64 }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          umask 077
          list="$RUNNER_TEMP/disclosure-denylist.txt"
          rc=0
          python3 -B tools/publish/decode_denylist.py "$list" || rc=$?
          if [ "$rc" = "3" ]; then
            if [ "$IS_PR" = "true" ]; then
              echo "::warning title=Disclosure scan skipped::the denylist secret is not available to this pull request"
              exit 0
            fi
            echo "::error title=Disclosure scan cannot run::a deploy is not allowed without the disclosure scan"
            exit 1
          fi
          [ "$rc" = "0" ] || exit "$rc"
          python3 -B tools/publish/check_disclosure.py --denylist "$list" built

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, disclosure]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
