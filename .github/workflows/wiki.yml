# GitHub wiki (D-031). The wiki is generated, never hand-edited: tools/publish/build_wiki.py
# builds every page from the governed documents of this commit, and this workflow mirrors the
# result into the wiki repository with --delete, so a page edited in the web UI is replaced at
# the next run. The governance workflow runs first.
#
# The private denylist reaches CI only as DISCLOSURE_DENYLIST_B64 (one line of base64, so the
# log masker holds a string no log line contains), decoded to a 0600 file by
# tools/publish/decode_denylist.py in ONE job, `disclosure`, which prints nothing but the
# scan's own output. See the header of governance.yml for why a plain secret is never used.
#
# One-time setup by the repository owner: create any first page in the wiki's web UI (the
# wiki repository does not exist until then). If the default token cannot push to the wiki,
# add a fine-grained token with Contents: write on this repository as the secret
# WIKI_PUSH_TOKEN.
name: wiki

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "tools/**"
      - "README.md"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  governance:
    uses: ./.github/workflows/governance.yml
    secrets: inherit

  build:
    needs: governance
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build the wiki from this commit
        run: python3 -B tools/publish/build_wiki.py --out build/publish/wiki

      - name: Keep the built wiki
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wiki-pages
          path: build/publish/wiki/
          if-no-files-found: error
          retention-days: 1

  disclosure:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out (tools only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/publish

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Fetch the built wiki
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wiki-pages
          path: wiki

      # Substrate-Architecture and Substrate-Methodology are the substrate's own
      # pre-existing record and use some denylisted words in the substrate's sense, so they
      # are deliberately not scanned here or by governance's disclosure step; only the pull
      # request leak check reads changes to their sources.
      - name: Disclosure scan of the research wiki pages
        env:
          DISCLOSURE_DENYLIST_B64: ${{ secrets.DISCLOSURE_DENYLIST_B64 }}
        run: |
          umask 077
          list="$RUNNER_TEMP/disclosure-denylist.txt"
          rc=0
          python3 -B tools/publish/decode_denylist.py "$list" || rc=$?
          if [ "$rc" = "3" ]; then
            echo "::error title=Disclosure scan cannot run::the wiki is not published without the disclosure scan"
            exit 1
          fi
          [ "$rc" = "0" ] || exit "$rc"
          cd wiki
          python3 -B ../tools/publish/check_disclosure.py --denylist "$list" \
            Home.md _Sidebar.md _Footer.md Research-*.md \
            Substrate-Overview.md Substrate-Status.md

  publish:
    needs: [build, disclosure]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch the built wiki
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wiki-pages
          path: built-wiki

      - name: Mirror into the wiki repository
        env:
          PUSH_TOKEN: ${{ secrets.WIKI_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if ! git clone --quiet "https://x-access-token:${PUSH_TOKEN}@github.com/${REPO}.wiki.git" wiki-repo; then
            echo "The wiki repository is not reachable. Create a first page in the wiki's web UI once, then re-run." >&2
            exit 1
          fi
          rsync -a --delete --exclude .git built-wiki/ wiki-repo/
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "wiki already matches this commit"
            exit 0
          fi
          git commit --quiet -m "docs(wiki): regenerate from ${GITHUB_SHA::12}"
          git push --quiet origin HEAD
